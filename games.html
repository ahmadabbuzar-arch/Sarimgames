<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro Library – PLAYZONE</title>
<meta name="description" content="Free retro and open-source games that run in your browser.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@700&family=Pixelify+Sans:wght@700&display=swap">
<style>
:root{--bg:#F2F0E8;--ink:#0F0F14;--y:#FFCE1F;--r:#F0443A;--head:"Archivo Black",Impact,"Arial Black",sans-serif;--mono:"Space Mono","Courier New",monospace;--pix:"Pixelify Sans","Courier New",monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*,*::before,*::after{box-sizing:inherit;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
.w{max-width:1200px;margin:0 auto;padding:0 16px}
.hd{background:var(--ink);color:var(--bg)}.hd .w{display:flex;justify-content:space-between;align-items:center;height:56px}
.hd a{color:var(--bg);text-decoration:none;font:700 .85rem var(--mono);letter-spacing:.04em}.hd .logo{font:700 1.4rem var(--pix);color:var(--y)}
h1{font:400 clamp(2.2rem,9vw,4.5rem)/.98 var(--head);text-transform:uppercase;margin:2rem 0 .8rem}
#t{font-size:clamp(1.8rem,6vw,3.2rem);line-height:1;margin:1.4rem 0 .8rem}
.lead{font:600 1.05rem/1.6 system-ui,sans-serif;max-width:36em;margin:0 0 1.5rem}
.tools,.row{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}.tools{margin:0 0 1.2rem}.row{margin:0 0 1rem}
input[type=search]{font:400 1rem system-ui,sans-serif;height:44px;padding:0 .9rem;border:3px solid var(--ink);background:#fff;color:var(--ink);flex:1 1 220px;max-width:360px}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.b{font:400 .8rem var(--head);text-transform:uppercase;letter-spacing:.02em;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:0 .9rem;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.b:active{transform:translate(3px,3px);box-shadow:none}.b[aria-pressed=true],.b.y{background:var(--y)}
:focus-visible{outline:3px solid var(--r);outline-offset:2px}
#count{font:700 .85rem var(--mono);margin:0 0 1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px;margin:0 6px 3rem 0}
.card{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;transition:transform .08s,box-shadow .08s}
.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.card .th{display:block;aspect-ratio:4/3;background:var(--ink);border-bottom:3px solid var(--ink);overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .cb{padding:1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.card h2{font:400 1.25rem/1.1 var(--head);text-transform:uppercase;margin:0}.card p{margin:0;font-size:.9rem;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;font:700 .7rem var(--mono)}.tags span{border:2px solid var(--ink);padding:0 .4rem}
.empty{grid-column:1/-1;border:3px dashed var(--ink);padding:1.5rem;font:700 .9rem var(--mono)}
.cred{border-top:3px solid var(--ink);padding:1rem 0 2.5rem;font:700 .75rem/1.6 var(--mono)}.cred details{max-width:60ch}.cred summary{cursor:pointer;text-decoration:underline}.cred a,.note a{text-decoration:underline}
.stage{position:relative;width:100%;height:min(74vh,calc((100vw - 38px)*.75));min-height:320px;background:#000;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--r);overflow:hidden}
.stage:fullscreen,.stage:-webkit-full-screen{width:100%;height:100%;border:0;box-shadow:none}
#game{position:absolute;inset:0}
#ov{position:absolute;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:1rem;background:var(--ink);color:var(--y);text-align:center;padding:1rem}
#ov p{font:400 clamp(1rem,3.5vw,1.5rem) var(--head);text-transform:uppercase;margin:0}
.pb{width:min(260px,70vw);height:16px;border:3px solid var(--y);overflow:hidden}.pb i{display:block;height:100%;width:40%;background:var(--y);animation:mv 1.1s linear infinite}
@keyframes mv{from{margin-left:-40%}to{margin-left:100%}}
.hint,.note{font:700 .8rem/1.5 var(--mono);margin:1rem 0 0;max-width:60ch}.note{opacity:.7}
@media (orientation:landscape) and (max-height:520px){body.play .hd,body.play #t,body.play .hint,body.play .note{display:none}body.play .row{margin:.5rem 0}body.play .stage{height:calc(100vh - 72px - env(safe-area-inset-top,0px));min-height:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.pb i{animation:none;width:100%}}
</style>
</head>

const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
const gid = new URLSearchParams(location.search).get('g');

/* ---------- library ---------- */
let cat = 'All', term = '';
function render() {
  const list = GAMES.filter(g => (cat === 'All' || g.category === cat) && (g.title + ' ' + g.system + ' ' + g.desc).toLowerCase().includes(term));
  $('#count').textContent = list.length + (list.length === 1 ? ' game' : ' games');
  const grid = $('#grid'); grid.innerHTML = '';
  if (!list.length) { grid.append(el('div', 'empty', 'No games match your search.')); return; }
  list.forEach(g => {
    const c = el('article', 'card'), th = el('a', 'th'), cb = el('div', 'cb');
    th.href = '/games/?g=' + encodeURIComponent(g.id); th.setAttribute('aria-label', 'Play ' + g.title);
    if (g.thumb) { const i = el('img'); i.src = g.thumb; i.alt = ''; i.loading = 'lazy'; i.width = 640; i.height = 480; th.append(i); }
    const tags = el('div', 'tags'); [g.system, g.category, g.license].forEach(t => tags.append(el('span', '', t)));
    const play = el('a', 'b y', 'Play'); play.href = th.href;
    cb.append(el('h2', '', g.title), tags, el('p', '', g.desc), play); c.append(th, cb); grid.append(c);
  });
}
function chips() {
  const box = $('#chips'); box.innerHTML = '';
  ['All', ...new Set(GAMES.map(g => g.category))].forEach(n => { const b = el('button', 'b', n); b.type = 'button'; b.setAttribute('aria-pressed', n === cat); b.onclick = () => { cat = n; chips(); render(); }; box.append(b); });
}
function credits() {
  const box = $('#credits');
  box.append(el('p', '', 'Games run on EmulatorJS (GPL-3.0, emulatorjs.org) with libretro cores. Packaging by portable-retro-games (MIT, © 2026 Aciiderixx). See NOTICE.md.'));
  GAMES.forEach(g => { const p = el('p', '', g.title + ': ' + g.license + ', ' + g.credit + '. '); const a = el('a', '', 'Project page'); a.href = g.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; p.append(a); box.append(p); });
}

/* ---------- player ---------- */
let tm;
const fail = msg => { clearTimeout(tm); $('#ovt').textContent = msg; $('#pb').hidden = true; $('#rt').hidden = false; $('#bk').hidden = false; $('#ov').hidden = false; };
const loadScript = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Could not load ' + src)); document.head.append(s); });
async function boot() {
  $('#ov').hidden = false; $('#pb').hidden = false; $('#rt').hidden = true; $('#bk').hidden = true; $('#ovt').textContent = 'Loading game…';
  const g = GAMES.find(x => x.id === gid);
  if (!g) { $('#t').textContent = 'Game not found'; return fail('This game is not in the library.'); }
  document.title = g.title + ' – Retro Library'; $('#t').textContent = g.title; $('#hint').textContent = g.controls || '';
  const cr = $('#cr'); cr.textContent = g.title + ': ' + g.license + ', ' + g.credit + '. Runs on EmulatorJS. '; const a = el('a', '', 'Project page'); a.href = g.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; cr.append(a);
  tm = setTimeout(() => fail('The game took too long to load. Check your connection and try again.'), 60000);
  try {
    if (!document.getElementById('ejs-css')) { const l = document.createElement('link'); l.id = 'ejs-css'; l.rel = 'stylesheet'; l.href = '/emulator.min.css'; document.head.append(l); }
    if (typeof EmulatorJS === 'undefined') await loadScript('/emulator.min.js');
    EmulatorJS.prototype.checkForUpdates = () => {}; /* skip the engine's call to the EmulatorJS CDN */
    $('#game').innerHTML = '';
    const emu = new EmulatorJS('#game', { gameUrl: g.rom, dataPath: '/', system: g.core, gameName: g.title, color: '#FFCE1F', startOnLoad: false, threads: false, volume: 0.5, disableDatabases: false });
    window.EJS_emulator = emu;
    emu.on('ready', () => { clearTimeout(tm); $('#ov').hidden = true; $('#fs').disabled = false; });
  } catch (e) { fail('Could not start the emulator: ' + e.message); }
}
$('#rt').onclick = () => location.reload();
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$('#fs').onclick = () => {
  const st = $('#stage');
  try { if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else Promise.resolve((st.requestFullscreen || st.webkitRequestFullscreen).call(st)).then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (_) {} }).catch(() => {}); } catch (_) {}
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { if (!fsEl()) { try { screen.orientation.unlock(); } catch (_) {} } }));

/* ---------- start ---------- */
if (gid !== null) { document.body.classList.add('play'); $('#lib').hidden = true; $('#player').hidden = false; boot(); }
else { $('#q').oninput = e => { term = e.target.value.trim().toLowerCase(); render(); }; chips(); render(); credits(); }
</script>
