<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play – Retro Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@700&family=Pixelify+Sans:wght@700&display=swap">
<style>
:root{--bg:#F2F0E8;--ink:#0F0F14;--y:#FFCE1F;--r:#F0443A;--head:"Archivo Black",Impact,"Arial Black",sans-serif;--mono:"Space Mono","Courier New",monospace;--pix:"Pixelify Sans","Courier New",monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*,*::before,*::after{box-sizing:inherit;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.hd{background:var(--ink);color:var(--bg)}.w{max-width:1100px;margin:0 auto;padding:0 16px}
.hd .w{display:flex;justify-content:space-between;align-items:center;height:56px}
.hd a{color:var(--bg);text-decoration:none;font:700 .85rem var(--mono);letter-spacing:.04em}.hd .logo{font:700 1.4rem var(--pix);color:var(--y)}
h1{font:400 clamp(1.8rem,6vw,3.2rem)/1 var(--head);text-transform:uppercase;margin:1.4rem 0 .8rem}
.b{font:400 .85rem var(--head);text-transform:uppercase;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:.5rem .9rem;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.b:active{transform:translate(3px,3px);box-shadow:none}.b.y{background:var(--y)}
.row{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin:0 0 1rem}
.stage{position:relative;width:100%;height:min(74vh,calc((100vw - 38px)*.75));min-height:320px;background:#000;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--r);overflow:hidden}
.stage:fullscreen,.stage:-webkit-full-screen{width:100%;height:100%;border:0;box-shadow:none}
#game{position:absolute;inset:0}
#ov{position:absolute;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:1rem;background:var(--ink);color:var(--y);text-align:center;padding:1rem}
#ov[hidden]{display:none}#ov p{font:400 clamp(1rem,3.5vw,1.5rem) var(--head);text-transform:uppercase;margin:0}
.pb{width:min(260px,70vw);height:16px;border:3px solid var(--y);overflow:hidden}.pb i{display:block;height:100%;width:40%;background:var(--y);animation:mv 1.1s linear infinite}
@keyframes mv{from{margin-left:-40%}to{margin-left:100%}}
.hint,.note{font:700 .8rem/1.5 var(--mono);margin:1rem 0 0;max-width:60ch}.note{opacity:.7}.note a{text-decoration:underline}
@media (orientation:landscape) and (max-height:520px){.hd,#t,.hint,.note{display:none}.row{margin:.5rem 0}.stage{height:calc(100vh - 72px - env(safe-area-inset-top,0px));min-height:0}}
@media(prefers-reduced-motion:reduce){.pb i{animation:none;width:100%}}
</style>
</head>
<body>
<header class="hd"><div class="w"><a href="./">&larr; RETRO LIBRARY</a><a class="logo" href="/">PLAYZONE</a></div></header>
<main class="w">
<h1 id="t">Loading…</h1>
<div class="row"><button class="b" id="fs" type="button" disabled>⛶ Fullscreen</button><a class="b" href="./">Back to games</a></div>
<div class="stage" id="stage">
  <div id="game"></div>
  <div id="ov"><p id="ovt">Loading game…</p><div class="pb" id="pb"><i></i></div><button class="b y" id="rt" type="button" hidden>Retry</button><a class="b" id="bk" href="./" hidden>Back to library</a></div>
</div>
<p class="hint" id="hint"></p>
<p class="note" id="cr"></p>
</main>
<script>
const $ = s => document.querySelector(s);
const gid = new URLSearchParams(location.search).get('g');
let tm, started = false;
const fail = msg => { clearTimeout(tm); $('#ovt').textContent = msg; $('#pb').hidden = true; $('#rt').hidden = false; $('#bk').hidden = false; $('#ov').hidden = false; };
const loadScript = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Could not load ' + src)); document.head.append(s); });
async function boot() {
  $('#ov').hidden = false; $('#pb').hidden = false; $('#rt').hidden = true; $('#bk').hidden = true; $('#ovt').textContent = 'Loading game…';
  let g;
  try { const list = await (await fetch('games.json')).json(); g = list.find(x => x.id === gid); } catch (e) { return fail('Could not load the game list.'); }
  if (!g) { $('#t').textContent = 'Game not found'; return fail('This game is not in the library.'); }
  document.title = g.title + ' – Retro Library'; $('#t').textContent = g.title; $('#hint').textContent = g.controls || '';
  const cr = $('#cr'); cr.textContent = g.title + ': ' + g.license + ', ' + g.credit + '. Runs on EmulatorJS. '; const a = document.createElement('a'); a.href = g.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = 'Project page'; cr.append(a);
  tm = setTimeout(() => fail('The game took too long to load. Check your connection and try again.'), 60000);
  try {
    if (!document.getElementById('ejs-css')) { const l = document.createElement('link'); l.id = 'ejs-css'; l.rel = 'stylesheet'; l.href = 'emu/emulator.min.css'; document.head.append(l); }
    if (typeof EmulatorJS === 'undefined') await loadScript('emu/emulator.min.js');
    EmulatorJS.prototype.checkForUpdates = () => {}; /* skip the engine's call to the EmulatorJS CDN */
    $('#game').innerHTML = '';
    const emu = new EmulatorJS('#game', { gameUrl: g.rom, dataPath: 'emu/', system: g.core, gameName: g.title, color: '#FFCE1F', startOnLoad: false, threads: false, volume: 0.5, disableDatabases: false });
    window.EJS_emulator = emu;
    emu.on('ready', () => { clearTimeout(tm); $('#ov').hidden = true; $('#fs').disabled = false; });
    emu.on('start', () => { started = true; });
  } catch (e) { fail('Could not start the emulator: ' + e.message); }
}
$('#rt').onclick = () => location.reload();
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$('#fs').onclick = () => {
  const st = $('#stage');
  try { if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else Promise.resolve((st.requestFullscreen || st.webkitRequestFullscreen).call(st)).then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (_) {} }).catch(() => {}); } catch (_) {}
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { if (!fsEl()) { try { screen.orientation.unlock(); } catch (_) {} } }));
boot();
</script>
</body>
</html>
